services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: drive
      POSTGRES_PASSWORD: drive
      POSTGRES_DB: drive
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "drive"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  postgres:
