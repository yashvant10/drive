name: Checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: drive
          POSTGRES_PASSWORD: drive
          POSTGRES_DB: drive_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U drive -d drive_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://drive:drive@127.0.0.1:5432/drive_test
      WEB_ORIGIN: http://localhost:3000
      API_URL: http://127.0.0.1:8000
      RUN_DB_TESTS: '1'
      PLAYWRIGHT_MUTATIONS: '1'
      PLAYWRIGHT_DEMO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: services/api/requirements.txt }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - name: Check API
        working-directory: services/api
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          alembic check
          python -m pytest -q
          export PLAYWRIGHT_ADMIN_EMAIL="browser-admin@example.com"
          export PLAYWRIGHT_ADMIN_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(30))')"
          echo "::add-mask::$PLAYWRIGHT_ADMIN_PASSWORD"
          PYTHONPATH=. python tests/bootstrap_browser.py
          printf 'PLAYWRIGHT_ADMIN_EMAIL=%s\nPLAYWRIGHT_ADMIN_PASSWORD=%s\n' "$PLAYWRIGHT_ADMIN_EMAIL" "$PLAYWRIGHT_ADMIN_PASSWORD" >> "$GITHUB_ENV"
          APP_ENV=test PAYMENT_MODE=demo uvicorn app.main:app --host 127.0.0.1 > /tmp/drive-api.log 2>&1 &
          curl -fsS --retry 10 --retry-connrefused http://127.0.0.1:8000/health
      - name: Check web
        working-directory: apps/web
        run: |
          npm ci
          npm run lint
          npm run build
          npm run typecheck
          npx playwright install --with-deps chromium
          npm run start > /tmp/drive-web.log 2>&1 &
          curl -fsS --retry 10 --retry-connrefused http://localhost:3000/ >/dev/null
          npm test
